name: Tests and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install . pytest==8.4.1 werkzeug==3.1.3 asgiref python-dotenv
      - name: Run tests
        run: python -m pytest tests/

  build-and-run:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build packages
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and Flaskr in a virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install dist/*.whl
          .venv/bin/python -m pip install --no-deps ./examples/tutorial
      - name: Initialize database
        run: .venv/bin/flask --app flaskr init-db
      - name: Run application on port 5000
        run: |
          .venv/bin/flask --app flaskr run --port 5000 &
          for i in {1..10}; do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              echo "Flaskr is running on port 5000"
              exit 0
            fi
            sleep 1
          done
          echo "Flaskr did not start"
          exit 1
